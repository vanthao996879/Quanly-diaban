<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Địa Bàn CSKV - CÔNG AN NHÂN DÂN VIỆT NAM</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Nếu không tìm thấy file ảnh nền nội bộ, trang sẽ hiển thị màu xám đen dự phòng */
            background-color: #2b3240;
            background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), 
                              url('689d77b0aa39bf3aed273721_3.jpg');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background-color: rgba(26, 34, 52, 0.95);
            border: 1px solid #2a344d;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            text-align: center;
            position: relative;
        }

        .badge-container {
            width: 85px;
            height: 85px;
            margin: 0 auto 20px auto;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #e53935;
            box-shadow: 0 0 15px rgba(229, 57, 53, 0.5);
            overflow: hidden;
        }

        .badge-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .system-title {
            color: #ff5252;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .system-subtitle {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            color: #a0aec0;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            background-color: #111827;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            border-color: #e53935;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(229, 57, 53, 0.3);
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="badge-container">
            <!-- Thêm thuộc tính onerror: Nếu không tìm thấy file nội bộ, trình duyệt sẽ tự động lấy ảnh từ mạng để thay thế -->
            <img src="logo-cong-an_3.jpg" alt="Huy hiệu CAND" 
                 onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/1/1d/Vietnam_People%27s_Police_emblem.svg/200px-Vietnam_People%27s_Police_emblem.svg.png';">
        </div>

        <div class="system-title">CÔNG AN NHÂN DÂN VIỆT NAM</div>
        <div class="system-subtitle">Hệ Thống Quản Lý Địa Bàn CSKV</div>

        <!-- Thêm sự kiện onsubmit để kích hoạt tính năng đăng nhập -->
        <form onsubmit="xulyDangNhap(event)">
            <div class="form-group">
                <label class="form-label">Nhập Địa Chỉ Gmail Công Vụ</label>
                <input type="email" id="emailInput" class="form-input" value="canbo.cskv@gmail.com" required>
            </div>
            <button type="submit" class="submit-btn">Xác Thực & Tiếp Tục &rarr;</button>
        </form>
    </div>

    <!-- Script xử lý đăng nhập -->
    <script>
        function xulyDangNhap(event) {
            // Ngăn chặn form tải lại trang (chặn hành vi mặc định)
            event.preventDefault(); 
            
            // Lấy email người dùng nhập
            const email = document.getElementById('emailInput').value;
            
            if (email) {
                // Hiển thị thông báo xác nhận thành công
                alert('Đang xác thực hệ thống cho cán bộ: ' + email + '\n\nXác thực thành công! Bắt đầu chuyển hướng...');
                
                // HƯỚNG DẪN: Để chuyển sang trang quản lý chính, bạn hãy xóa dấu "//" ở dòng code bên dưới và thay "trang_chu.html" bằng tên file trang đích của bạn.
                // window.location.href = "trang_chu.html";
            }
        }
    </script>
</body>
</html>
