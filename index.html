<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Địa Bàn CSKV - CÔNG AN NHÂN DÂN VIỆT NAM</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Thay ảnh nền Công an Việt Nam của bạn */
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), 
                        url('689d77b0aa39bf3aed273721_3.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background-color: rgba(26, 34, 52, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            text-align: center;
            position: relative;
            backdrop-filter: blur(8px); /* Hiệu ứng mờ nền mượt mà */
        }

        /* Khu vực hiển thị Huy hiệu CAND */
        .badge-container {
            width: 85px;
            height: 85px;
            margin: 0 auto 20px auto;
            background: #ffffff; /* Nền trắng tôn màu huy hiệu */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #e53935;
            box-shadow: 0 0 15px rgba(229, 57, 53, 0.5);
            overflow: hidden;
        }

        .badge-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .system-title {
            color: #ff5252;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .system-subtitle {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            color: #a0aec0;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            background-color: #111827;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-input:focus {
            border-color: #e53935;
            box-shadow: 0 0 8px rgba(229, 57, 53, 0.4);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.1s, box-shadow 0.3s;
            box-shadow: 0 4px 12px rgba(229, 57, 53, 0.3);
        }

        .submit-btn:hover {
            opacity: 0.95;
            box-shadow: 0 6px 18px rgba(229, 57, 53, 0.5);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Đã thay bằng ảnh Huy hiệu CAND thực tế của bạn -->
        <div class="badge-container">
            <img src="logo-cong-an_3.jpg" alt="Huy hiệu Công an Nhân dân">
        </div>

        <div class="system-title">CÔNG AN NHÂN DÂN VIỆT NAM</div>
        <div class="system-subtitle">Hệ Thống Quản Lý Địa Bàn CSKV</div>

        <form>
            <div class="form-group">
                <label class="form-label">Nhập Địa Chỉ Gmail Công Vụ</label>
                <input type="email" class="form-input" value="canbo.cskv@gmail.com" required>
            </div>
            <button type="submit" class="submit-btn">Xác Thực & Tiếp Tục &rarr;</button>
        </form>
    </div>

</body>
</html>
