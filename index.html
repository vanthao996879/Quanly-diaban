<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Địa Bàn CSKV - CÔNG AN NHÂN DÂN VIỆT NAM</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Hình nền tổng thể giao diện (có thể thay thế link ảnh nền tùy ý) */
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background-color: #1a2234;
            border: 1px solid #2a344d;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
        }

        /* Khu vực hiển thị Huy hiệu CAND */
        .badge-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px auto;
            background: #252d42;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #e53935;
            box-shadow: 0 0 15px rgba(229, 57, 53, 0.4);
            overflow: hidden;
        }

        .badge-container img, .badge-container svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .system-title {
            color: #ff5252;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .system-subtitle {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            color: #a0aec0;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            background-color: #111827;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            border-color: #e53935;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(229, 57, 53, 0.3);
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Huy hiệu CAND chuẩn dạng SVG nhúng trực tiếp, đảm bảo luôn hiển thị hình ảnh sắc nét không sợ lỗi link -->
        <div class="badge-container">
            <svg viewBox="0 0 24 24" fill="#e53935" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-3zm0 2.18l7 2.33v4.54c0 4.54-3.2 8.79-7 9.82-3.8-1.03-7-5.28-7-9.82V6.51l7-2.33z"/>
                <path d="M12 7l-2.5 3h2v4h1v-4h2L12 7z" fill="#ffffff"/>
            </svg>
        </div>

        <div class="system-title">CÔNG AN NHÂN DÂN VIỆT NAM</div>
        <div class="system-subtitle">Hệ Thống Quản Lý Địa Bàn CSKV</div>

        <form>
            <div class="form-group">
                <label class="form-label">Nhập Địa Chỉ Gmail Công Vụ</label>
                <input type="email" class="form-input" value="canbo.cskv@gmail.com" required>
            </div>
            <button type="submit" class="submit-btn">Xác Thực & Tiếp Tục &rarr;</button>
        </form>
    </div>

</body>
</html>
